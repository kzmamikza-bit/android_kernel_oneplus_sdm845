name: Build OnePlus 6 KernelSU
on:
  workflow_dispatch:

jobs:
  build:
    name: Build Kernel with KSU
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout Source
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python2 libc6-dev-i386 lib32ncurses6 lib32tinfo6 gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

        # Force system to use Python 2
        sudo ln -sf /usr/bin/python2 /usr/bin/python

    - name: Setup LineageOS Clang
      run: |
        # Clone LineageOS Clang 12
        git clone --depth=1 https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b toolchain

    - name: Setup KernelSU and Fixes
      run: |
        # --- 1. KernelSU Setup ---
        curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -

        # --- 2. Apply Manual Hooks for Kernel 4.9 ---
        
        # FIX fs/exec.c
        sed -i '1i #include "../drivers/kernelsu/ksu.h"' fs/exec.c
        sed -i '/return retval;/i \\tif (ksu_handle_execveat(&fd, &filename, &argv, &envp, &flags)) return 0;' fs/exec.c
        
        # FIX fs/open.c (TYPE CAST FIX)
        # We define the prototype manually AND we cast (int *)&mode to silence the incompatible pointer type error.
        
        sed -i '/struct filename \*tmp;/a extern int ksu_handle_faccessat(int *dfd, const char __user **filename_user, int *mode, int *flags);\n\tif (ksu_handle_faccessat(&dfd, &filename, (int *)&mode, NULL)) return 0;' fs/open.c

        # --- 3. FIX: Define missing OnePlus CPU constants ---
        sed -i '1i #define LITTLE_CLUSTER_CPU_NUMBER 0' kernel/power/main.c
        sed -i '1i #define BIG_CLUSTER_CPU_NUMBER 4' kernel/power/main.c
        sed -i '1i #define RESUME_BOOST_LITTLE_CPU_QOS_FREQ 300000' kernel/power/main.c
        sed -i '1i #define RESUME_BOOST_BIG_CPU_QOS_FREQ 825600' kernel/power/main.c

        # --- 4. FIX: Define mark_reserved for sched/fair.c ---
        sed -i '1i #define mark_reserved(x) do {} while (0)' kernel/sched/fair.c

        # --- 5. Enable KSU in Defconfig ---
        echo "CONFIG_KSU=y" >> arch/arm64/configs/enchilada_defconfig
        echo "CONFIG_KPROBES=y" >> arch/arm64/configs/enchilada_defconfig
        echo "CONFIG_HAVE_KPROBES=y" >> arch/arm64/configs/enchilada_defconfig
        echo "CONFIG_KPROBE_EVENTS=y" >> arch/arm64/configs/enchilada_defconfig

    - name: Build Kernel
      run: |
        export PATH=$GITHUB_WORKSPACE/toolchain/bin:$PATH
        export ARCH=arm64
        export SUBARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
        export CC=clang
        export LD=ld.lld
        
        make clean && make mrproper
        
        make O=out enchilada_defconfig
        
        # --- CRITICAL CONFIG FIXES ---
        sed -i 's/CONFIG_NR_CPUS=[0-9]*/CONFIG_NR_CPUS=8/' out/.config
        echo "CONFIG_NO_HZ_COMMON=y" >> out/.config
        echo "CONFIG_NO_HZ_IDLE=y" >> out/.config
        echo "CONFIG_NO_HZ=y" >> out/.config
        # --- END FIXES ---
        
        make O=out -j$(nproc --all) Image.gz-dtb

    - name: Package with AnyKernel3
      run: |
        git clone https://github.com/osm0sis/AnyKernel3
        cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
        cd AnyKernel3
        sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
        zip -r9 kernel-ksu-op6.zip *

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: OnePlus6-KernelSU-Installer
        path: AnyKernel3/kernel-ksu-op6.zip
