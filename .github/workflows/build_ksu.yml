name: Build OnePlus 6 KernelSU
on:
  workflow_dispatch:

jobs:
  build:
    name: Build Kernel with KSU
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout Source
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python2 libc6-dev-i386 lib32ncurses6 lib32tinfo6 gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

        # Force system to use Python 2
        sudo ln -sf /usr/bin/python2 /usr/bin/python

    - name: Setup LineageOS Clang
      run: |
        # Clone LineageOS Clang 12
        git clone --depth=1 https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b toolchain

    - name: Setup KernelSU and Fixes
      run: |
        # --- 1. KernelSU Setup ---
        curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -

        # --- 2. Apply Manual Hooks for Kernel 4.9 (NUCLEAR MODE) ---
        
        # FIX fs/exec.c
        sed -i '1i extern int ksu_handle_execveat(int *fd, void *filename_user, void *argv, void *envp, int *flags);' fs/exec.c
        sed -i '/bprm = kzalloc/i \\tif (ksu_handle_execveat(&fd, (void *)&filename, (void *)&argv, (void *)&envp, &flags)) return 0;' fs/exec.c
        
        # FIX fs/open.c
        sed -i '/struct filename \*tmp;/a extern int ksu_handle_faccessat(int *dfd, const char __user **filename_user, int *mode, int *flags);\n\tif (ksu_handle_faccessat(&dfd, &filename, (int *)&mode, NULL)) return 0;' fs/open.c

        # --- 3. FIX: OnePlus Drivers Compilation Errors ---
        sed -i '1i #include <linux/stacktrace.h>' drivers/oneplus/drivers/oem_trace/oem_trace.c
        # Force silence in problematic folders
        echo "ccflags-y += -w" >> drivers/oneplus/drivers/oem_trace/Makefile
        echo "ccflags-y += -w" >> drivers/oneplus/drivers/param_read_write/Makefile
        # FIX: Synaptics Touchscreen Warning
        echo "ccflags-y += -w" >> drivers/input/touchscreen/Makefile

        # --- 4. FIX: Recursively Disable Warnings as Errors ---
        find . -name "Makefile" -type f -exec sed -i 's/-Werror//g' {} +
        echo "KBUILD_CFLAGS += -Wno-error" >> Makefile
        echo "KBUILD_CFLAGS += -Wno-sizeof-pointer-memaccess" >> Makefile
        sed -i 's/-implicit-function-declaration/-Wimplicit-function-declaration/g' Makefile

        # --- 5. FIX: LINKER ERRORS (Nuke & Stub) ---
        find drivers -name "oem_force_dump.c" -exec sh -c 'echo "// Nuked by GitHub Actions" > {}' \;
        
        cat >> init/main.c <<EOF
        /* DUMMY FUNCTIONS FOR LINKER FIXES */
        void rpmhstats_statistics(void) {}
        void unfreezer_fork(void) {}
        void save_dump_reason_to_smem(void) {}
        int oem_get_download_mode(void) { return 0; }
        void msm_serial_oem_init(void) {}
        /* End Dummy Functions */
        EOF
        
        # --- 6. FIX: Device Tree (DTC) Errors (THE IMPOSTOR STRATEGY v3) ---
        MTP_FILE=$(find arch/arm64/boot/dts/qcom -name "*sdm845-mtp.dts*" | head -n 1)
        
        if [ -f "$MTP_FILE" ]; then
            echo "Found working DTS: $MTP_FILE"
            # Overwrite CDP, INTERPOSER, and RB3 files
            find arch/arm64/boot/dts/qcom -name "*cdp*.dts*" -exec cp "$MTP_FILE" {} \;
            find arch/arm64/boot/dts/qcom -name "*interposer*.dts*" -exec cp "$MTP_FILE" {} \;
            find arch/arm64/boot/dts/qcom -name "*rb3*.dts*" -exec cp "$MTP_FILE" {} \;
            echo "Replaced all broken CDP, INTERPOSER, and RB3 files with MTP version."
        else
            echo "Warning: MTP DTS not found, trying fallback deletion."
            sed -i '/cdp\.dtb/d' arch/arm64/boot/dts/qcom/Makefile
        fi
        
        # --- 7. FIX: KernelSU Compatibility with Old Kernel (4.9) ---
        
        # A. Fix compiler_types.h
        echo '#include <linux/compiler.h>' > include/linux/compiler_types.h
        
        # B. Fix sched/signal.h
        mkdir -p include/linux/sched
        echo -e "#include <linux/sched.h>\n#include <linux/signal.h>" > include/linux/sched/signal.h
        
        # C. Fix pgtable.h
        echo '#include <asm/pgtable.h>' > include/linux/pgtable.h
        
        # D. Fix task_stack.h
        echo '#include <linux/sched.h>' > include/linux/sched/task_stack.h

        # E. Fix task.h
        echo '#include <linux/sched.h>' > include/linux/sched/task.h
        
        # F. Fix TWA_RESUME (allowlist.c)
        sed -i '1i #define TWA_RESUME 1' drivers/kernelsu/allowlist.c
        
        # G. Fix filter_count
        sed -i '/filter_count/d' drivers/kernelsu/app_profile.c
        
        # H. FIX: pkg_observer.c (handle_inode_event -> handle_event)
        sed -i 's/handle_inode_event/handle_event/g' drivers/kernelsu/pkg_observer.c
        
        # I. FIX: setuid_hook.c (force_sig mismatch)
        sed -i 's/force_sig(SIGKILL)/force_sig(SIGKILL, current)/g' drivers/kernelsu/setuid_hook.c

        # J. FIX: kernel_umount.c (TWA_RESUME missing)
        sed -i '1i #define TWA_RESUME 1' drivers/kernelsu/kernel_umount.c

        # K. FIX: supercalls.c (TWA_RESUME missing)
        sed -i '1i #define TWA_RESUME 1' drivers/kernelsu/supercalls.c

        # L. FIX: ksud.c (TWA_RESUME missing)
        sed -i '1i #define TWA_RESUME 1' drivers/kernelsu/ksud.c

        # M. FIX: seccomp_cache.c (Missing Constant & Modern Types)
        sed -i '1i #define SECCOMP_ARCH_NATIVE_NR 1' drivers/kernelsu/seccomp_cache.c
        sed -i 's/refcount_t/atomic_t/g' drivers/kernelsu/seccomp_cache.c
        sed -i 's/refcount_set/atomic_set/g' drivers/kernelsu/seccomp_cache.c
        sed -i 's/refcount_inc/atomic_inc/g' drivers/kernelsu/seccomp_cache.c
        sed -i 's/refcount_read/atomic_read/g' drivers/kernelsu/seccomp_cache.c
        sed -i 's/refcount_dec_and_test/atomic_dec_and_test/g' drivers/kernelsu/seccomp_cache.c

        # N. FIX: file_wrapper.c (MASSIVE CLEANUP for Kernel 4.9) - NEW!
        # 1. Define missing __poll_t
        sed -i '1i typedef unsigned int __poll_t;' drivers/kernelsu/file_wrapper.c
        # 2. Remove iopoll (not in 4.9)
        sed -i '/iopoll/d' drivers/kernelsu/file_wrapper.c
        # 3. Remove remap_file_range (not in 4.9)
        sed -i '/remap_file_range/d' drivers/kernelsu/file_wrapper.c
        sed -i '/REMAP_FILE_DEDUP/d' drivers/kernelsu/file_wrapper.c
        # 4. Remove fadvise (not in f_op in 4.9)
        sed -i '/fadvise/d' drivers/kernelsu/file_wrapper.c
        # 5. Remove mmap_supported_flags (not in 4.9)
        sed -i '/mmap_supported_flags/d' drivers/kernelsu/file_wrapper.c

    - name: Build Kernel
      run: |
        export PATH=$GITHUB_WORKSPACE/toolchain/bin:$PATH
        export ARCH=arm64
        export SUBARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
        export CC=clang
        export LD=ld.lld
        
        make clean && make mrproper
        
        # --- SMART CONFIG DETECTION ---
        echo "Searching for Config file..."
        if [ -f "arch/arm64/configs/sdm845_defconfig" ]; then
            echo "Found sdm845_defconfig! Using it as base."
            cp arch/arm64/configs/sdm845_defconfig arch/arm64/configs/enchilada_defconfig
        elif [ -f "arch/arm64/configs/oneplus6_defconfig" ]; then
             echo "Found oneplus6_defconfig! Using it as base."
             cp arch/arm64/configs/oneplus6_defconfig arch/arm64/configs/enchilada_defconfig
        else
             echo "Config not found! Listing available configs:"
             ls arch/arm64/configs/
        fi
        
        # --- INJECT KERNELSU INTO CONFIG ---
        echo "CONFIG_KSU=y" >> arch/arm64/configs/enchilada_defconfig
        echo "CONFIG_KPROBES=y" >> arch/arm64/configs/enchilada_defconfig
        echo "CONFIG_HAVE_KPROBES=y" >> arch/arm64/configs/enchilada_defconfig
        echo "CONFIG_KPROBE_EVENTS=y" >> arch/arm64/configs/enchilada_defconfig
        
        # Generate config
        make O=out enchilada_defconfig
        
        # --- CRITICAL CONFIG FIXES (Post-Generation) ---
        sed -i 's/CONFIG_NR_CPUS=[0-9]*/CONFIG_NR_CPUS=8/' out/.config
        echo "CONFIG_NO_HZ_COMMON=y" >> out/.config
        echo "CONFIG_NO_HZ_IDLE=y" >> out/.config
        echo "CONFIG_NO_HZ=y" >> out/.config
        echo "CONFIG_STACKTRACE=y" >> out/.config
        echo "CONFIG_STACKTRACE_SUPPORT=y" >> out/.config
        
        # Force KSU compilation & Silence Warnings
        echo -e "\nobj-y += kernelsu/" >> drivers/Makefile
        echo "ccflags-y += -w" >> drivers/kernelsu/Makefile
        # --- END FIXES ---
        
        # Start Build
        make O=out -j$(nproc --all) Image.gz-dtb

    - name: Package with AnyKernel3
      run: |
        git clone https://github.com/osm0sis/AnyKernel3
        cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
        cd AnyKernel3
        sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
        zip -r9 kernel-ksu-op6.zip *

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: OnePlus6-KernelSU-Installer
        path: AnyKernel3/kernel-ksu-op6.zip
