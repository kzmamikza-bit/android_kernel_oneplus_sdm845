name: Build OnePlus 6 KernelSU
on:
  workflow_dispatch:

jobs:
  build:
    name: Build Kernel with KSU
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout Source
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python2 libc6-dev-i386 lib32ncurses6 lib32tinfo6 gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

        # Force system to use Python 2
        sudo ln -sf /usr/bin/python2 /usr/bin/python

    - name: Setup LineageOS Clang
      run: |
        # Clone LineageOS Clang 12
        git clone --depth=1 https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b toolchain

    - name: Setup KernelSU and Fixes
      run: |
        # --- 1. KernelSU Setup ---
        curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -

        # --- 2. Apply Manual Hooks for Kernel 4.9 (NUCLEAR MODE) ---
        
        # FIX fs/exec.c
        sed -i '1i extern int ksu_handle_execveat(int *fd, void *filename_user, void *argv, void *envp, int *flags);' fs/exec.c
        sed -i '/bprm = kzalloc/i \\tif (ksu_handle_execveat(&fd, (void *)&filename, (void *)&argv, (void *)&envp, &flags)) return 0;' fs/exec.c
        
        # FIX fs/open.c
        sed -i '/struct filename \*tmp;/a extern int ksu_handle_faccessat(int *dfd, const char __user **filename_user, int *mode, int *flags);\n\tif (ksu_handle_faccessat(&dfd, &filename, (int *)&mode, NULL)) return 0;' fs/open.c

        # --- 3. CLEANUP: Removed conflicting manual definitions ---
        # We removed the fixes for kernel/power/main.c and kernel/sched/fair.c
        # because the Smart Config now loads the real definitions correctly.
        
        # --- 4. FIX: OnePlus Drivers Compilation Errors ---
        sed -i '1i #include <linux/stacktrace.h>' drivers/oneplus/drivers/oem_trace/oem_trace.c
        echo "ccflags-y += -w" >> drivers/oneplus/drivers/oem_trace/Makefile
        echo "ccflags-y += -w" >> drivers/oneplus/drivers/param_read_write/Makefile

        # --- 5. FIX: Recursively Disable Warnings as Errors ---
        find . -name "Makefile" -type f -exec sed -i 's/-Werror//g' {} +
        echo "KBUILD_CFLAGS += -Wno-error" >> Makefile
        echo "KBUILD_CFLAGS += -Wno-sizeof-pointer-memaccess" >> Makefile
        sed -i 's/-implicit-function-declaration/-Wimplicit-function-declaration/g' Makefile

        # --- 6. FIX: LINKER ERRORS (Nuke & Stub) ---
        find drivers -name "oem_force_dump.c" -exec sh -c 'echo "// Nuked by GitHub Actions" > {}' \;
        
        cat >> init/main.c <<EOF
        /* DUMMY FUNCTIONS FOR LINKER FIXES */
        void rpmhstats_statistics(void) {}
        void unfreezer_fork(void) {}
        void save_dump_reason_to_smem(void) {}
        int oem_get_download_mode(void) { return 0; }
        void msm_serial_oem_init(void) {}
        /* End Dummy Functions */
        EOF

    - name: Build Kernel
      run: |
        export PATH=$GITHUB_WORKSPACE/toolchain/bin:$PATH
        export ARCH=arm64
        export SUBARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
        export CC=clang
        export LD=ld.lld
        
        make clean && make mrproper
        
        # --- SMART CONFIG DETECTION ---
        echo "Searching for Config file..."
        if [ -f "arch/arm64/configs/sdm845_defconfig" ]; then
            echo "Found sdm845_defconfig! Using it as base."
            cp arch/arm64/configs/sdm845_defconfig arch/arm64/configs/enchilada_defconfig
        elif [ -f "arch/arm64/configs/oneplus6_defconfig" ]; then
             echo "Found oneplus6_defconfig! Using it as base."
             cp arch/arm64/configs/oneplus6_defconfig arch/arm64/configs/enchilada_defconfig
        else
             echo "Config not found! Listing available configs:"
             ls arch/arm64/configs/
        fi
        
        # --- INJECT KERNELSU INTO CONFIG ---
        echo "CONFIG_KSU=y" >> arch/arm64/configs/enchilada_defconfig
        echo "CONFIG_KPROBES=y" >> arch/arm64/configs/enchilada_defconfig
        echo "CONFIG_HAVE_KPROBES=y" >> arch/arm64/configs/enchilada_defconfig
        echo "CONFIG_KPROBE_EVENTS=y" >> arch/arm64/configs/enchilada_defconfig
        
        # Generate config
        make O=out enchilada_defconfig
        
        # --- CRITICAL CONFIG FIXES (Post-Generation) ---
        sed -i 's/CONFIG_NR_CPUS=[0-9]*/CONFIG_NR_CPUS=8/' out/.config
        echo "CONFIG_NO_HZ_COMMON=y" >> out/.config
        echo "CONFIG_NO_HZ_IDLE=y" >> out/.config
        echo "CONFIG_NO_HZ=y" >> out/.config
        echo "CONFIG_STACKTRACE=y" >> out/.config
        echo "CONFIG_STACKTRACE_SUPPORT=y" >> out/.config
        
        # Force KSU compilation in Makefile
        echo -e "\nobj-y += kernelsu/" >> drivers/Makefile
        # --- END FIXES ---
        
        # Start Build
        make O=out -j$(nproc --all) Image.gz-dtb

    - name: Package with AnyKernel3
      run: |
        git clone https://github.com/osm0sis/AnyKernel3
        cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
        cd AnyKernel3
        sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
        zip -r9 kernel-ksu-op6.zip *

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: OnePlus6-KernelSU-Installer
        path: AnyKernel3/kernel-ksu-op6.zip
