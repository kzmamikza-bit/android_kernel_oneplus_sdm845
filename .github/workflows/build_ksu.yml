name: Build OnePlus 6 KernelSU
on:
  workflow_dispatch:

jobs:
  build:
    name: Build Kernel with KSU
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout Source
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python2 libc6-dev-i386 lib32ncurses6 lib32tinfo6 gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi
        sudo ln -sf /usr/bin/python2 /usr/bin/python

    - name: Setup LineageOS Clang
      run: |
        git clone --depth=1 https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b toolchain

    - name: Setup KernelSU and Fixes
      run: |
        # 1. KernelSU Setup
        curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -

        # 2. KernelSU Patching (Kernel 4.9 Hooks)
        sed -i '1i extern int ksu_handle_execveat(int *fd, void *filename_user, void *argv, void *envp, int *flags);' fs/exec.c
        sed -i '/bprm = kzalloc/i \\tif (ksu_handle_execveat(&fd, (void *)&filename, (void *)&argv, (void *)&envp, &flags)) return 0;' fs/exec.c
        sed -i '/struct filename \*tmp;/a extern int ksu_handle_faccessat(int *dfd, const char __user **filename_user, int *mode, int *flags);\n\tif (ksu_handle_faccessat(&dfd, &filename, (int *)&mode, NULL)) return 0;' fs/open.c

        # 3. FIX: Global Compiler Flags & Warnings
        find . -name "Makefile" -type f -exec sed -i 's/-Werror//g' {} +
        # Fix the specific implicit declaration error
        find . -name "Makefile" -type f -exec sed -i 's/-implicit-function-declaration/-Wimplicit-function-declaration/g' {} +
        
        # 4. Kernel 4.9 Compatibility Headers
        echo '#include <linux/compiler.h>' > include/linux/compiler_types.h
        mkdir -p include/linux/sched
        echo -e "#include <linux/sched.h>\n#include <linux/signal.h>" > include/linux/sched/signal.h
        echo '#include <asm/pgtable.h>' > include/linux/pgtable.h

        # 5. KernelSU Source Fixes
        sed -i 's/force_sig(SIGKILL)/force_sig(SIGKILL, current)/g' drivers/kernelsu/setuid_hook.c
        
        rm -f drivers/kernelsu/file_wrapper.c
        cat > drivers/kernelsu/file_wrapper.c <<EOF
        #include <linux/fs.h>
        #include <linux/file.h>
        #include <linux/slab.h>
        #include <linux/module.h>
        #include "file_wrapper.h"
        typedef unsigned int __poll_t;
        struct ksu_file_wrapper* ksu_create_file_wrapper(struct file* fp) {
            struct ksu_file_wrapper *wrapper = kzalloc(sizeof(*wrapper), GFP_KERNEL);
            if (!wrapper) return NULL;
            wrapper->orig = fp;
            wrapper->ops = *fp->f_op;
            wrapper->ops.owner = THIS_MODULE;
            return wrapper;
        }
        EOF

        cat > drivers/kernelsu/ksu_fix_header.h <<EOF
        #include <linux/sched.h>
        #include <linux/mm.h>
        #include <asm/pgtable.h>
        typedef pud_t p4d_t;
        #define p4d_offset(pgd, address) ((p4d_t *)pgd)
        EOF
        cat drivers/kernelsu/ksu_fix_header.h drivers/kernelsu/util.c > drivers/kernelsu/util.temp
        mv drivers/kernelsu/util.temp drivers/kernelsu/util.c

        sed -i '1i extern int selinux_enforcing;' drivers/kernelsu/selinux/selinux.c
        sed -i 's/selinux_state.enforcing/selinux_enforcing/g' drivers/kernelsu/selinux/selinux.c
        
        rm -f drivers/kernelsu/selinux/sepolicy.c
        cat > drivers/kernelsu/selinux/sepolicy.c <<EOF
        #include <linux/types.h>
        void ksu_handle_sepolicy(void *data, void *len) {}
        int ksu_load_sepolicy(void *data, void *len) { return 0; }
        void ksu_restore_sepolicy(void) {}
        EOF

        rm -f drivers/kernelsu/selinux/rules.c
        cat > drivers/kernelsu/selinux/rules.c <<EOF
        #include <linux/types.h>
        void ksu_suppress_selinux(void) {}
        EOF

    - name: Build Kernel
      run: |
        export PATH=$GITHUB_WORKSPACE/toolchain/bin:$PATH
        export ARCH=arm64
        export SUBARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
        export CC=clang
        export LD=ld.lld
        
        make clean && make mrproper
        cp arch/arm64/configs/sdm845_defconfig arch/arm64/configs/enchilada_defconfig
        
        # --- INJECT CONFIGS ---
        echo "CONFIG_KSU=y" >> arch/arm64/configs/enchilada_defconfig
        echo "CONFIG_KPROBES=y" >> arch/arm64/configs/enchilada_defconfig
        
        # FIX FOR SECURITY FLAGS
        echo "# CONFIG_CC_STACKPROTECTOR_STRONG is not set" >> arch/arm64/configs/enchilada_defconfig
        echo "CONFIG_CC_STACKPROTECTOR_NONE=y" >> arch/arm64/configs/enchilada_defconfig
        
        make O=out enchilada_defconfig
        
        # Final flag fixes before building
        sed -i 's/-implicit-function-declaration/-Wimplicit-function-declaration/g' out/Makefile || true

        make O=out -j$(nproc --all) Image.gz-dtb

    - name: Package with AnyKernel3
      run: |
        git clone https://github.com/osm0sis/AnyKernel3
        cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
        cd AnyKernel3
        sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
        zip -r9 kernel-ksu-op6-final.zip *

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: OnePlus6-KernelSU-Final
        path: AnyKernel3/kernel-ksu-op6-final.zip
