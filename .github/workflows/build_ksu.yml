name: Build OnePlus 6 KernelSU
on:
  workflow_dispatch:

jobs:
  build:
    name: Build Kernel with KSU
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout Source
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python2 libc6-dev-i386 lib32ncurses6 lib32tinfo6 gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi
        sudo ln -sf /usr/bin/python2 /usr/bin/python

    - name: Setup LineageOS Clang
      run: |
        git clone --depth=1 https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b toolchain

    - name: Setup KernelSU and Fixes
      run: |
        # --- 1. KernelSU Setup ---
        curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -

        # --- 2. RESTORED HEADERS (Vital for Kernel 4.9) ---
        echo '#include <linux/compiler.h>' > include/linux/compiler_types.h
        mkdir -p include/linux/sched
        echo -e "#include <linux/sched.h>\n#include <linux/signal.h>" > include/linux/sched/signal.h
        echo '#include <asm/pgtable.h>' > include/linux/pgtable.h
        echo '#include <linux/sched.h>' > include/linux/sched/task_stack.h
        echo '#include <linux/sched.h>' > include/linux/sched/task.h

        # --- 3. FIX: pkg_observer.c (Rename handle_inode_event) ---
        sed -i 's/handle_inode_event/handle_event/g' drivers/kernelsu/pkg_observer.c

        # --- 4. FIX: KernelSU Hooks for 4.9 ---
        sed -i '1i extern int ksu_handle_execveat(int *fd, void *filename_user, void *argv, void *envp, int *flags);' fs/exec.c
        sed -i '/bprm = kzalloc/i \\tif (ksu_handle_execveat(&fd, (void *)&filename, (void *)&argv, (void *)&envp, &flags)) return 0;' fs/exec.c
        sed -i '/struct filename \*tmp;/a extern int ksu_handle_faccessat(int *dfd, const char __user **filename_user, int *mode, int *flags);\n\tif (ksu_handle_faccessat(&dfd, &filename, (int *)&mode, NULL)) return 0;' fs/open.c

        # --- 5. FIX: OnePlus Drivers & Warnings (SAFE MODE) ---
        sed -i '1i #include <linux/stacktrace.h>' drivers/oneplus/drivers/oem_trace/oem_trace.c
        
        # Silence Specific Makefiles (Prepend to avoid corruption)
        sed -i '1i ccflags-y += -w' drivers/oneplus/drivers/oem_trace/Makefile
        sed -i '1i ccflags-y += -w' drivers/oneplus/drivers/param_read_write/Makefile
        sed -i '1i ccflags-y += -w' drivers/input/touchscreen/Makefile
        sed -i '1i ccflags-y += -w' drivers/media/platform/msm/camera/cam_isp/isp_hw_mgr/hw_utils/irq_controller/Makefile
        sed -i '1i ccflags-y += -w' drivers/net/can/spi/Makefile
        sed -i '1i ccflags-y += -w' drivers/clk/Makefile
        sed -i '1i ccflags-y += -w' drivers/kernelsu/Makefile
        sed -i '1i ccflags-y += -w' drivers/oneplus/coretech/cpufreq_bouncing/Makefile
        sed -i '1i ccflags-y += -w' drivers/oneplus/coretech/houston/Makefile
        sed -i '1i ccflags-y += -w' drivers/oneplus/coretech/tpd/Makefile
        
        # NEW FIX: Silence Power Supply (Charging) Drivers
        sed -i '1i ccflags-y += -w' drivers/power/supply/qcom/Makefile

        # --- 6. Global Compiler Flags ---
        find . -name "Makefile" -type f -exec sed -i 's/-Werror//g' {} +
        sed -i 's/-implicit-function-declaration/-Wimplicit-function-declaration/g' Makefile
        echo "KBUILD_CFLAGS += -Wno-error" >> Makefile
        echo "KBUILD_CFLAGS += -Wno-sizeof-pointer-memaccess" >> Makefile
        echo "KBUILD_CFLAGS += -Wno-misleading-indentation" >> Makefile
        echo "KBUILD_CFLAGS += -Wno-memset-elt-size" >> Makefile
        echo "KBUILD_CFLAGS += -Wno-incompatible-pointer-types" >> Makefile
        echo "KBUILD_CFLAGS += -Wno-format" >> Makefile
        echo "KBUILD_CFLAGS += -Wno-unused-result" >> Makefile
        echo "KBUILD_CFLAGS += -Wno-strict-prototypes" >> Makefile
        # NEW GLOBAL FIX: Ignore duplicate declarations
        echo "KBUILD_CFLAGS += -Wno-duplicate-decl-specifier" >> Makefile

        # --- 7. KernelSU Source Fixes ---
        
        # A. Fix filter_count
        sed -i '/filter_count/d' drivers/kernelsu/app_profile.c
        
        # B. Fix setuid_hook
        sed -i 's/force_sig(SIGKILL)/force_sig(SIGKILL, current)/g' drivers/kernelsu/setuid_hook.c

        # C. FIX: seccomp_cache.c (Refcount to Atomic Translation)
        sed -i '1i #define SECCOMP_ARCH_NATIVE_NR 1' drivers/kernelsu/seccomp_cache.c
        sed -i 's/refcount_t/atomic_t/g' drivers/kernelsu/seccomp_cache.c
        sed -i 's/refcount_set/atomic_set/g' drivers/kernelsu/seccomp_cache.c
        sed -i 's/refcount_inc/atomic_inc/g' drivers/kernelsu/seccomp_cache.c
        sed -i 's/refcount_read/atomic_read/g' drivers/kernelsu/seccomp_cache.c
        sed -i 's/refcount_dec_and_test/atomic_dec_and_test/g' drivers/kernelsu/seccomp_cache.c
        
        # D. Re-build file_wrapper.c
        rm -f drivers/kernelsu/file_wrapper.c
        cat > drivers/kernelsu/file_wrapper.c <<EOF
        #include <linux/fs.h>
        #include <linux/file.h>
        #include <linux/slab.h>
        #include <linux/module.h>
        #include "file_wrapper.h"
        typedef unsigned int __poll_t;
        struct ksu_file_wrapper* ksu_create_file_wrapper(struct file* fp) {
            struct ksu_file_wrapper *wrapper = kzalloc(sizeof(*wrapper), GFP_KERNEL);
            if (!wrapper) return NULL;
            wrapper->orig = fp;
            wrapper->ops = *fp->f_op;
            wrapper->ops.owner = THIS_MODULE;
            return wrapper;
        }
        EOF

        # E. Util.c Fix
        cat > drivers/kernelsu/ksu_fix_header.h <<EOF
        #include <linux/sched.h>
        #include <linux/mm.h>
        #include <asm/pgtable.h>
        typedef pud_t p4d_t;
        #define p4d_offset(pgd, address) ((p4d_t *)pgd)
        EOF
        cat drivers/kernelsu/ksu_fix_header.h drivers/kernelsu/util.c > drivers/kernelsu/util.temp
        mv drivers/kernelsu/util.temp drivers/kernelsu/util.c

        # F. TWA_RESUME Fix
        echo "#ifndef TWA_RESUME" > ksu_twa_fix.h
        echo "#define TWA_RESUME 1" >> ksu_twa_fix.h
        echo "#endif" >> ksu_twa_fix.h
        
        cat ksu_twa_fix.h drivers/kernelsu/allowlist.c > drivers/kernelsu/allowlist.temp && mv drivers/kernelsu/allowlist.temp drivers/kernelsu/allowlist.c
        cat ksu_twa_fix.h drivers/kernelsu/kernel_umount.c > drivers/kernelsu/kernel_umount.temp && mv drivers/kernelsu/kernel_umount.temp drivers/kernelsu/kernel_umount.c
        cat ksu_twa_fix.h drivers/kernelsu/ksud.c > drivers/kernelsu/ksud.temp && mv drivers/kernelsu/ksud.temp drivers/kernelsu/ksud.c
        cat ksu_twa_fix.h drivers/kernelsu/supercalls.c > drivers/kernelsu/supercalls.temp && mv drivers/kernelsu/supercalls.temp drivers/kernelsu/supercalls.c

        # G. SELinux & Sepolicy Stubs
        sed -i '1i extern int selinux_enforcing;' drivers/kernelsu/selinux/selinux.c
        sed -i 's/selinux_state.enforcing/selinux_enforcing/g' drivers/kernelsu/selinux/selinux.c
        
        rm -f drivers/kernelsu/selinux/sepolicy.c
        cat > drivers/kernelsu/selinux/sepolicy.c <<EOF
        #include <linux/types.h>
        void ksu_handle_sepolicy(void *data, void *len) {}
        int ksu_load_sepolicy(void *data, void *len) { return 0; }
        void ksu_restore_sepolicy(void) {}
        EOF

        rm -f drivers/kernelsu/selinux/rules.c
        cat > drivers/kernelsu/selinux/rules.c <<EOF
        #include <linux/types.h>
        void ksu_suppress_selinux(void) {}
        EOF

        # --- 8. LINKER FIXES ---
        find drivers -name "oem_force_dump.c" -exec sh -c 'echo "// Nuked by GitHub Actions" > {}' \;
        cat >> init/main.c <<EOF
        void rpmhstats_statistics(void) {}
        void unfreezer_fork(void) {}
        void save_dump_reason_to_smem(void) {}
        int oem_get_download_mode(void) { return 0; }
        void msm_serial_oem_init(void) {}
        EOF

        # --- 9. DTC Fix ---
        MTP_FILE=$(find arch/arm64/boot/dts/qcom -name "*sdm845-mtp.dts*" | head -n 1)
        if [ -n "$MTP_FILE" ]; then
            find arch/arm64/boot/dts/qcom -name "*cdp*.dts*" -exec cp "$MTP_FILE" {} \;
            find arch/arm64/boot/dts/qcom -name "*interposer*.dts*" -exec cp "$MTP_FILE" {} \;
            find arch/arm64/boot/dts/qcom -name "*rb3*.dts*" -exec cp "$MTP_FILE" {} \;
        fi

    - name: Build Kernel
      run: |
        export PATH=$GITHUB_WORKSPACE/toolchain/bin:$PATH
        export ARCH=arm64
        export SUBARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
        export CC=clang
        export LD=ld.lld
        
        make clean && make mrproper
        cp arch/arm64/configs/sdm845_defconfig arch/arm64/configs/enchilada_defconfig
        
        echo "CONFIG_KSU=y" >> arch/arm64/configs/enchilada_defconfig
        echo "CONFIG_KPROBES=y" >> arch/arm64/configs/enchilada_defconfig
        echo "CONFIG_HAVE_KPROBES=y" >> arch/arm64/configs/enchilada_defconfig
        echo "CONFIG_KPROBE_EVENTS=y" >> arch/arm64/configs/enchilada_defconfig
        echo "# CONFIG_CC_STACKPROTECTOR_STRONG is not set" >> arch/arm64/configs/enchilada_defconfig
        echo "CONFIG_CC_STACKPROTECTOR_NONE=y" >> arch/arm64/configs/enchilada_defconfig
        
        make O=out enchilada_defconfig
        
        sed -i 's/CONFIG_NR_CPUS=[0-9]*/CONFIG_NR_CPUS=8/' out/.config
        echo "CONFIG_NO_HZ_COMMON=y" >> out/.config
        echo "CONFIG_NO_HZ_IDLE=y" >> out/.config
        echo "CONFIG_NO_HZ=y" >> out/.config
        echo "CONFIG_STACKTRACE=y" >> out/.config
        echo "CONFIG_STACKTRACE_SUPPORT=y" >> out/.config

        make O=out -j$(nproc --all) Image.gz-dtb

    - name: Package with AnyKernel3
      run: |
        git clone https://github.com/osm0sis/AnyKernel3
        cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
        cd AnyKernel3
        sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
        zip -r9 kernel-ksu-op6-final.zip *

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: OnePlus6-KernelSU-Final
        path: AnyKernel3/kernel-ksu-op6-final.zip
